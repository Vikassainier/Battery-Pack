[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-thermal"
version = "0.1.0"
description = "EV battery pack thermal analysis and cooling-system sizing engine + web tool"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["battery_thermal*"]

[tool.setuptools.package-data]
battery_thermal = ["api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
